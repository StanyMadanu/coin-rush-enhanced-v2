<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#17112b">
  <meta name="description" content="Coin Rush: collect gold coins, dodge the spiky orbs and survive as long as you can.">
  <!-- Progressive Web App files (relative paths, so the game also works from a sub-folder) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Coin Rush">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Coin Rush</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game" data-state="menu" data-timed="false">
    <canvas id="canvas"></canvas>
    <div id="safe" aria-hidden="true"></div>

    <!-- Score, stage, lives and bomb charge (the timer is only shown on stages that have a time limit) -->
    <div id="hud" class="hidden">
      <div class="cell left">
        <div class="tag" id="stageTag">STAGE 1</div>
        <div class="stat">Score <b id="score">0</b></div>
      </div>
      <div class="cell center" id="timeBox" data-u="0">
        <div class="tag">TIME</div>
        <div class="time"><b id="time">60</b></div>
      </div>
      <div class="cell right">
        <div id="lives" aria-label="Lives"></div>
        <div class="pill" id="bombPill"><i></i>BOMB <span id="bombCount">0</span>/1</div>
      </div>
    </div>

    <!-- Bottom bar: BLAST button, controls hint, and sound / pause / fullscreen -->
    <div id="bar">
      <div class="bar-left">
        <button id="soundBtn" class="mini" type="button">Sound: On</button>
        <button id="pauseBtn" class="mini pause-only" type="button">Pause</button>
        <button id="fsBtn" class="mini hidden" type="button" aria-pressed="false">Fullscreen</button>
      </div>
      <div id="barHint" class="hint-text"></div>
      <button id="blastBtn" class="off" type="button" tabindex="-1" aria-label="Blast" aria-disabled="true"><span>BLAST</span><small>NO BOMB</small></button>
    </div>
    <div id="toast" class="hidden" role="status"></div>

    <!-- Start screen -->
    <div id="start" class="screen">
      <div class="panel">
        <h1>Coin Rush</h1>
        <div class="stages" id="stageChips"></div>
        <p id="startInfo"></p>
        <button id="startBtn" class="main" type="button">Start game</button>
        <button id="installBtn" class="secondary hidden" type="button">Install app</button>
        <p id="installInfo" class="hint install-info hidden"></p>
        <p class="legend" id="legend"></p>
        <p class="hint">Move with <b>W A S D</b> or the <b>arrow keys</b>, blast with <b>Space</b>.<br>On a phone: drag your finger to move, tap <b>BLAST</b>.</p>
      </div>
    </div>

    <!-- Pause screen -->
    <div id="pauseScreen" class="screen hidden">
      <div class="panel">
        <h1>Paused</h1>
        <button id="resumeBtn" class="main" type="button">Resume</button>
        <p class="hint">Press <b>P</b> to pause or resume.</p>
      </div>
    </div>

    <!-- Game-over screen -->
    <div id="over" class="screen hidden">
      <div class="panel">
        <h1>Game over</h1>
        <p id="reason"></p>
        <p class="big">Score <b id="finalScore">0</b></p>
        <p id="best"></p>
        <button id="restartBtn" class="main" type="button">Play again</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
